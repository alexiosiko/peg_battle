name: Build iOS (unsigned IPA)

on:
  workflow_dispatch:

env:
  HOMEBREW_NO_AUTO_UPDATE: 1

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Load .env
        run: |
          set -e
          [ -f .env ] || { echo "::error::.env not found"; exit 1; }
          tr -d '\r' < .env | while IFS='=' read -r key value || [ -n "$key" ]; do
            key="${key#export }"
            key="$(echo "$key" | xargs)"
            [[ -z "$key" || "$key" == \#* ]] && continue
            value="$(echo "$value" | xargs)"
            value="${value%\"}"; value="${value#\"}"
            echo "${key}=${value}" >> "$GITHUB_ENV"
          done

      - name: Download Godot headless
        run: |
          set -e
          curl -fsSL -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/${{ env.GODOT_VERSION }}/Godot_v${{ env.GODOT_VERSION }}_macos.universal.zip"
          unzip -q godot.zip -d godot

      - name: Install official iOS export template
        run: |
          set -e
          ver="${GODOT_VERSION/-/.}"
          dir="$HOME/Library/Application Support/Godot/export_templates/$ver"
          mkdir -p "$dir" "$RUNNER_TEMP/tpz_out"
          curl -fsSL -o "$RUNNER_TEMP/templates.tpz" "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q -j "$RUNNER_TEMP/templates.tpz" 'templates/ios.zip' -d "$RUNNER_TEMP/tpz_out"
          cp "$RUNNER_TEMP/tpz_out/ios.zip" "$dir/ios.zip"

      - name: Disable encryption in export preset
        run: |
          sed -i '' \
            -e 's|^encrypt_pck=.*|encrypt_pck=false|' \
            -e 's|^encrypt_directory=.*|encrypt_directory=false|' \
            -e 's|^script_encryption_key=.*|script_encryption_key=""|' \
            -e 's|^\(custom_template/release=\)".*"|\1""|' \
            -e 's|^\(custom_template/debug=\)".*"|\1""|' \
            export_presets.cfg

      - name: Export to Xcode project
        run: |
          set -e
          mkdir -p build/ios
          rm -rf addons/eos-android-export
          GODOT=godot/Godot.app/Contents/MacOS/Godot

          $GODOT --headless --path . --import || true
          $GODOT --headless --path . --import

          $GODOT --headless --path . \
            --export-release "${{ env.IOS_PRESET }}" \
            build/ios/${{ env.GODOT_PROJECT_NAME }}.xcodeproj

      - name: xcodebuild archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project build/ios/${{ env.GODOT_PROJECT_NAME }}.xcodeproj \
            -scheme "${{ env.GODOT_PROJECT_NAME }}" \
            -archivePath build/ios/App.xcarchive \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty

      - name: Package IPA
        run: |
          set -e
          cd build/ios
          mkdir -p Payload
          cp -R App.xcarchive/Products/Applications/*.app Payload/
          zip -r "${{ env.GODOT_PROJECT_NAME }}.ipa" Payload
          mv "${{ env.GODOT_PROJECT_NAME }}.ipa" ../../

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: ${{ env.GODOT_PROJECT_NAME }}.ipa
          retention-days: 14